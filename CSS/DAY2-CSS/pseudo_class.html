<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a:link{
            background-color: red;
        }
        a:active{
            color: burlywood;
            background-color: yellow;
        }
        a:visited{
            color: aqua;
        }
        input[type="radio"]:checked{
            height: 20px;
            width: 20px;
            accent-color: red;
        }
        input[type="checkbox"]:checked{
            height: 20px;
            width: 20px;
            accent-color: red;
        }
        input[type="text"]:focus{
            height: 200px;
            width: 200px;
            background-color: yellow;
            color: red;
        }
        button:hover{
            transform: scale(0.7);
            color: blue;
            background-color: yellow;
        }
    </style>
</head>

    <input type="radio" name="gen">Others  <br>

    </label>

    Address : <br><input type="text"><br>

</html>
