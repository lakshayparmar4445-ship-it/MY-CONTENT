<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 200px;
            width: 200px;
            /* border: 1px solid; */
            background: url(./images.webp) no-repeat center/cover;
            position: relative;
            margin: 60px auto;
            border-radius: 10px;
        }
        .txt{
            position: absolute;
            top: 75%;
            left: 30%;
            background-color: black;
            width: 100px;
            border-radius: 2px;
            opacity: 0.3;
            /* display: flex; */
        }
        .content{
            color: orange;
            position: relative;
            top: 75%;
            left: 30%;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="txt">.</div>
        <div class="content">Hello Opacity</div>
    </div>
</body>
</html>
