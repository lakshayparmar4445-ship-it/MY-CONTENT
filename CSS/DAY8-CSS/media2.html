<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
 body{
    font-family: Arial, Helvetica, sans-serif;
    font-size: 1.2em;
    padding: 20px;
    transition: background-color 0.5s ease;
 }

 /* media screen */
        @media screen {
             body::before{
                content: "This is visible on screen";
                display: block;
                font-weight: bold;
             }
        }

        /* Print only */
        @media print{
            body{
                background-color: white;
                color: green;
            }
            body::before{
                content: "pranjal gay";
                display: block;
                font-weight: bold;
            }
        }
        @media (min-width:30em){
            body{
                background-color: green;
            }
        }
        @media (max-width:50em){
            body{
                background-color: brown;
            }
        }
        @media (orientation: landscape){
            body{
                background-color: yellow;
            }
        }
        @media (orientation:portrait){
            body{
                background-color: aquamarine;
            }
        }
    </style>
</head>
<body>
    <h1>Responsive Media query Test</h1>
    <p>Resize the window or chnage</p>
</body>
</html>
