<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div>
        <h1>Weather Forecast</h1>
        <input type="text" placeholder="Enter City Name" id="city-input">
        <button id="get-weather-btn">Getweather</button>
        <div id="weather-info">
            <h2>Curr Weather</h2>
            <p id="city-name"></p>
            <p id="temperature"></p>
            <p id="humidity"></p>
            <p id="description"></p>
        </div>
        <div id="forecast-info">
            <h2>5-day forecast</h2>
            <ol id="forecast-list"></ol>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
