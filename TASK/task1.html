<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul type="circle">
        <li>Background color</li>
        <ul type="circle">
            <li><h2 style="background-color: green; border: 1px solid black; ">Green</h2></li>
            <li><h2 style="background-color: red; border: 1px solid black; ">Red</h2></li>
            <li>Other-Background color</li>
            <ul type="circle">
                <li><h2 style="background-color: blue; border: 1px solid black; ">Blue</h2></li>
                <li><h2 style="background-color: orange; border: 1px solid black; ">orange</h2></li>
                <li><h2 style="background-color: yellow; border: 1px solid black; ">yellow</h2></li>
            </ul>
        </ul>
        <li>Other background color</li>
        <ul type="square">
            <li>Crimson</li>
            <li>Note :</li>
            <dl>Lorem ipsum dolor sit amet consectetur.</dl>
        </ul>
        <ol type="A" start="4">
            <li><h2 style="background-color: blue; border: 1px solid black; ">Blue</h2></li>
            <li><h2 style="background-color: orange; border: 1px solid black; ">Orange</h2></li>
            <li><h2 style="background-color: red; border: 1px solid black; ">Red</h2></li>
        </ol>
    </ul>
</body>
</html>
