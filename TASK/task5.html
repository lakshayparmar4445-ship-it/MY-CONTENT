<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #dd{
            animation-name: ii;
            animation-duration: 2s;
            position: relative;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
            animation-direction: alternate-reverse;
            background-color: aliceblue;
        }
        #cc{
            background-color: aliceblue;
            border-color: black;
            border: 4px solid;
        }
        @keyframes ii{
            0%{
                top: 0px;
                bottom: 0px;
            }
            100%{
                top: 304px;
                /* bottom: 400px; */
            }
        }
    </style>
</head>
<body style="background-color: gray;">
    <div id="cc" style="height: 400px; width: 400px; border-style: dashed; border-radius: 10px; margin: auto; margin-top: 70px;">
        <div id="dd" style="height: 90px; width: 90px; border: 3px solid; border-radius: 10px; margin: auto;">
        </div>
    </div>
</body>
</html>
