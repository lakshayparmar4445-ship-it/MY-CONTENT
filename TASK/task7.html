<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
            margin: 0;
            color: white;
        }
        .pole{
            width: 20px;
            height: 400px;
            background-color: gray;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .traffic-light{
            width: 150px;
            height: 300px;
            background-color: black;
            border: 1px solid;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 20px rgb(135, 131, 131);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            position: absolute;
            top:25px;
            /* transform: translate(-50%); */
        }
        .light{
            width: 60px;
            height: 60px;
            background-color: white;
            border-radius: 50%;
            margin: 0 auto;
            opacity: 0.2;
            animation-duration: 6s;
            animation-iteration-count: infinite;
            animation-fill-mode: forwards;
        }
        .pink{
            background-color: pink;
            animation-name: pinkLight;
        }
        .orange{
            background-color: orange;
            animation-name: orangeLight;
            /* animation-delay: 2s; */
        }
        .aqua{
            background-color: aqua;
            animation-name: aquaLight;
            /* animation-delay: 4s; */
        }
        @keyframes pinkLight{
            0% ,20%{
                opacity: 1;
            }
            21% ,100%{
                opacity: 0.2;
            }
        }
        @keyframes orangeLight{
            0% ,33%{
                opacity: 0.2;
            }
            34% ,53%{
                opacity: 1;
            }
            54% ,100%{
                opacity: 0.2;
            }
        }
        @keyframes aquaLight{
            0%, 66%{
                opacity: 0.2;
            }
            67% ,86%{
                opacity: 1;
            }
            86% ,100%{
                opacity: 0.2;
            }
        }

    </style>
</head>
<body>
    <div class="pole">
        <div class="traffic-light"> 
            <div class="light pink"></div>
            <div class="light orange"></div>
            <div class="light aqua"></div>
        </div>
    </div>
</body>
</html>
